# Rebuilds places.pmtiles from OpenStreetMap once a month and publishes it on GitHub Pages.
# Run it any time from the Actions tab: "Update places" > "Run workflow".
name: Update places

on:
  schedule:
    - cron: "0 3 2 * *" # 03:00 UTC on the 2nd of every month
  workflow_dispatch:

permissions:
  contents: write # to note the build date, which also keeps the monthly schedule switched on
  pages: write
  id-token: write

concurrency:
  group: places
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool tippecanoe
      - name: Make room on disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build places for all of Europe
        run: WORK="$RUNNER_TEMP/work" OUT=site bash build.sh
      - name: Check size
        run: |
          size=$(stat -c %s site/places.pmtiles)
          echo "places.pmtiles is $((size / 1048576)) MB"
          # GitHub Pages sites can be at most 1 GB.
          [ "$size" -lt 950000000 ] || { echo "Too big for GitHub Pages"; exit 1; }
          cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Note the build date
        run: |
          cp site/info.json info.json
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add info.json
          git commit -m "Places rebuilt $(date -u +%Y-%m-%d)" || true
          git push

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
